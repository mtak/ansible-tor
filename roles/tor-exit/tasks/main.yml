---

- name: Write torrc
  template:
    src: torrc
    dest: /etc/tor/torrc
    owner: root
    group: root
    mode: 0644
  notify: restart_tor

- name: Remove obsolete DirPort front page
  file:
    path: /etc/tor/dirfrontpage.html
    state: absent

- name: Enable tor
  systemd:
    name: tor@default
    state: started
    enabled: true
